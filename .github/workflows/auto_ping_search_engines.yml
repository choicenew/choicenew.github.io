name: Automated Search Engine Ping & Instant IndexNow Notification

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours automatically
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto_ping:
    name: Auto Ping Google, Bing, Baidu, Yandex & IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Google Sitemap API
        run: |
          echo "Pinging Google Sitemap Endpoint..."
          curl -s -o /dev/null -w "Google Response: %{http_code}\n" "https://www.google.com/ping?sitemap=https://choicenew.github.io/sitemap.xml" || true

      - name: Ping Bing Sitemap API
        run: |
          echo "Pinging Bing Sitemap Endpoint..."
          curl -s -o /dev/null -w "Bing Response: %{http_code}\n" "https://www.bing.com/ping?sitemap=https://choicenew.github.io/sitemap.xml" || true

      - name: Send Instant IndexNow Payload (Bing, Yandex, Seznam, Naver)
        run: |
          echo "Triggering IndexNow Instant Crawl Protocol..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "choicenew.github.io",
              "key": "choicenew2026indexnowkey",
              "keyLocation": "https://choicenew.github.io/choicenew2026indexnowkey.txt",
              "urlList": [
                "https://choicenew.github.io/",
                "https://choicenew.github.io/index.html",
                "https://choicenew.github.io/nav/index.html",
                "https://choicenew.github.io/veherego/index.html",
                "https://choicenew.github.io/pyromagma/index.html",
                "https://choicenew.github.io/pyromagma/reader.html",
                "https://choicenew.github.io/yourcallyourrule/index.html"
              ]
            }' || true
